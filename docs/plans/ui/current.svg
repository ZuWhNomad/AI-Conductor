<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif">
  <title>Conductor 2.0 — current UI (annotated)</title>
  <defs>
    <style>
      .bg{fill:#0f1115} .bg2{fill:#161a21} .bg3{fill:#1e232c}
      .line{stroke:#2a3140;stroke-width:1} .fg{fill:#e6e8ee} .muted{fill:#8a93a6}
      .accent{fill:#7c9cff} .accent2{fill:#2f4fbf} .ok{fill:#46c88a} .warn{fill:#f0b64a}
      .bad{fill:#ef6b6b} .purple{fill:#b78cff}
      .lbl{fill:#8a93a6;font-size:10px;letter-spacing:.6px} text{fill:#e6e8ee;font-size:12px}
      .tiny{font-size:10px;fill:#8a93a6} .btn{fill:#1e232c;stroke:#2a3140;rx:6}
      .pin{fill:#ef6b6b} .pintxt{fill:#fff;font-size:11px;font-weight:700}
    </style>
  </defs>

  <rect class="bg" width="1280" height="880"/>

  <!-- ===================== SIDEBAR (320px) ===================== -->
  <rect class="bg2" x="0" y="0" width="320" height="880"/>
  <line class="line" x1="320" y1="0" x2="320" y2="880"/>

  <!-- brand -->
  <text x="14" y="29" font-size="15" font-weight="700">🎼 Conductor 2.0</text>
  <text x="296" y="29" class="muted" font-size="15">⚙</text>
  <line class="line" x1="0" y1="46" x2="320" y2="46"/>

  <!-- project folder + conductor picker + new chat -->
  <text x="14" y="64" class="lbl">PROJECT FOLDER</text>
  <rect class="bg3" x="14" y="72" width="266" height="26" rx="6"/><text x="22" y="89" class="muted">F:\Conductor 2.0</text>
  <rect class="bg3" x="284" y="72" width="22" height="26" rx="6"/><text x="291" y="89" class="muted">…</text>
  <text x="14" y="118" class="lbl">CONDUCTOR (PROVIDER : MODEL : EFFORT)</text>
  <rect class="bg3" x="14" y="126" width="78" height="26" rx="6"/><text x="22" y="143" class="fg">claude</text>
  <rect class="bg3" x="96" y="126" width="128" height="26" rx="6"/><text x="104" y="143" class="fg">opus-4.8</text>
  <rect class="bg3" x="228" y="126" width="78" height="26" rx="6"/><text x="236" y="143" class="fg">high</text>
  <text x="14" y="170" class="tiny">claude:opus-4.8:high</text>
  <rect class="bg3" x="150" y="160" width="14" height="14" rx="3"/><text x="168" y="171" class="tiny">auto-approve</text>
  <rect class="bg3" x="238" y="160" width="14" height="14" rx="3"/><text x="256" y="171" class="tiny">API overflow</text>
  <rect class="accent2" x="14" y="182" width="292" height="30" rx="8"/><text x="128" y="202" font-weight="600">+ New chat</text>
  <line class="line" x1="0" y1="224" x2="320" y2="224"/>

  <!-- providers and limits -->
  <text x="14" y="244" class="lbl">PROVIDERS &amp; LIMITS</text>
  <text x="210" y="244" class="tiny">▢ auto</text><rect class="bg3" x="258" y="234" width="48" height="16" rx="6"/><text x="264" y="245" class="tiny">↻ Refresh</text>
  <!-- provider rows w/ meters -->
  <g>
    <circle class="ok" cx="20" cy="266" r="4"/><text x="32" y="270" font-size="11">claude</text><text x="250" y="270" class="tiny">42% wk</text>
    <rect class="bg3" x="14" y="276" width="292" height="6" rx="3"/><rect class="ok" x="14" y="276" width="123" height="6" rx="3"/>
    <circle class="ok" cx="20" cy="298" r="4"/><text x="32" y="302" font-size="11">codex</text><text x="250" y="302" class="tiny">63% wk</text>
    <rect class="bg3" x="14" y="308" width="292" height="6" rx="3"/><rect class="warn" x="14" y="308" width="184" height="6" rx="3"/>
    <circle class="warn" cx="20" cy="330" r="4"/><text x="32" y="334" font-size="11">grok</text><text x="220" y="334" class="tiny">~est. 71%</text>
    <rect class="bg3" x="14" y="340" width="292" height="6" rx="3"/><rect class="warn" x="14" y="340" width="207" height="6" rx="3"/>
    <circle class="muted" cx="20" cy="362" r="4"/><text x="32" y="366" font-size="11">gemini</text><text x="250" y="366" class="tiny">0%</text>
    <rect class="bg3" x="14" y="372" width="292" height="6" rx="3"/><rect class="ok" x="14" y="372" width="6" height="6" rx="3"/>
    <circle class="muted" cx="20" cy="394" r="4"/><text x="32" y="398" font-size="11">ollama</text><text x="235" y="398" class="tiny">local</text>
  </g>
  <text x="14" y="424" class="tiny">refreshed 2m ago · auto off</text>
  <line class="line" x1="0" y1="436" x2="320" y2="436"/>

  <!-- chats (the only scrolling panel) -->
  <text x="14" y="456" class="lbl">CHATS</text>
  <rect class="bg3" x="8" y="464" width="304" height="26" rx="8"/><text x="16" y="481">Auto-planner research &amp; UI plan</text>
  <text x="14" y="509">Scorecard categories sweep</text>
  <text x="14" y="533">Windowless spawn poll-gating</text>
  <text x="14" y="557">Grok calibrate + reset day</text>
  <text x="14" y="581">UI category classifier</text>
  <text x="14" y="605" class="muted">Stress test 2026-09</text>
  <text x="14" y="629" class="muted">Feedback bundle flow</text>
  <line class="line" x1="0" y1="812" x2="320" y2="812"/>

  <!-- self-improvement -->
  <text x="14" y="834" class="lbl">SELF-IMPROVEMENT</text><rect class="bg3" x="196" y="824" width="24" height="15" rx="7"/><text x="202" y="835" class="tiny">7</text>
  <rect class="bg3" x="14" y="846" width="90" height="22" rx="6"/><text x="30" y="861" class="tiny">Open log</text>
  <rect class="bg3" x="110" y="846" width="90" height="22" rx="6"/><text x="124" y="861" class="tiny">Run review</text>

  <!-- ===================== MAIN ===================== -->
  <!-- header -->
  <text x="340" y="24" font-weight="600">Auto-planner research &amp; UI plan</text>
  <text x="340" y="40" class="tiny">F:\Conductor 2.0</text>
  <rect class="bg3" x="690" y="10" width="86" height="24" rx="6"/><text x="698" y="26" class="fg" font-size="11">claude</text>
  <rect class="bg3" x="780" y="10" width="120" height="24" rx="6"/><text x="788" y="26" class="fg" font-size="11">opus-4.8</text>
  <rect class="bg3" x="904" y="10" width="70" height="24" rx="6"/><text x="912" y="26" class="fg" font-size="11">high</text>
  <rect class="bg3" x="980" y="13" width="13" height="13" rx="3"/><text x="997" y="24" class="tiny">auto-approve</text>
  <rect class="bg3" x="1074" y="13" width="13" height="13" rx="3"/><text x="1091" y="24" class="tiny">overflow</text>
  <rect class="bg3" x="1156" y="10" width="52" height="24" rx="12"/><text x="1166" y="26" class="ok" font-size="11">idle</text>
  <rect x="1214" y="10" width="56" height="24" rx="6" fill="#1e232c" stroke="#ef6b6b"/><text x="1222" y="26" class="bad" font-size="11">■ Stop</text>
  <line class="line" x1="320" y1="46" x2="1280" y2="46"/>

  <!-- transcript -->
  <rect x="760" y="70" width="360" height="44" rx="10" fill="#2f4fbf"/><text x="775" y="88" font-size="11">Plan the auto-planner and a UI refresh; keep it</text><text x="775" y="104" font-size="11">grounded in the real DOM.</text>
  <rect class="bg2" x="340" y="128" width="470" height="60" rx="10" stroke="#2a3140"/><text x="354" y="148" font-size="11">On it. I'll read the HTML/CSS and the scorecard,</text><text x="354" y="164" font-size="11">then delegate the X research to a grok worker and</text><text x="354" y="180" font-size="11">draft the plans.</text>
  <rect class="bg2" x="340" y="200" width="470" height="30" rx="8" stroke="#2a3140"/><text x="356" y="219" class="muted" font-size="11">▸ delegate  search · grok  —  running…</text>
  <rect class="bg2" x="340" y="242" width="470" height="30" rx="8" stroke="#2a3140"/><text x="356" y="261" class="muted" font-size="11">▸ Read  ui/index.html, ui/styles.css</text>

  <!-- tasks strip -->
  <line class="line" x1="320" y1="640" x2="1280" y2="640"/>
  <rect class="bg2" x="340" y="654" width="250" height="60" rx="10" stroke="#7c9cff"/><text x="352" y="674" font-size="11" font-weight="600">X research (grok)</text><circle class="accent" cx="576" cy="669" r="5"/><text x="352" y="700" class="tiny">delegate · running · search@3</text>
  <rect class="bg2" x="602" y="654" width="250" height="60" rx="10" stroke="#46c88a"/><text x="614" y="674" font-size="11" font-weight="600">Read fixtures (astra)</text><text x="614" y="700" class="tiny">done · edit@2 · 1.1% wk</text>
  <rect class="bg2" x="864" y="654" width="250" height="60" rx="10" stroke="#2a3140"/><text x="876" y="674" font-size="11" font-weight="600">queued: dedupe</text><text x="876" y="700" class="tiny">waiting for slot</text>

  <!-- composer -->
  <line class="line" x1="320" y1="726" x2="1280" y2="726"/>
  <rect class="bg2" x="340" y="740" width="820" height="118" rx="8" stroke="#2a3140"/><text x="356" y="762" class="muted" font-size="11">Tell the conductor what to do…  (Enter to send, Shift+Enter for newline, Ctrl+M to dictate)</text>
  <rect class="bg3" x="1170" y="740" width="40" height="34" rx="8"/><text x="1182" y="762" font-size="15">🎤</text>
  <rect class="accent2" x="1216" y="740" width="54" height="34" rx="8"/><text x="1228" y="762" font-weight="600" font-size="12">Send</text>

  <!-- ============ PAIN-POINT PINS ============ -->
  <g font-weight="700">
    <circle class="pin" cx="300" cy="139" r="10"/><text x="296" y="143" class="pintxt">1</text>
    <circle class="pin" cx="960" cy="22" r="10"/><text x="956" y="26" class="pintxt">1</text>
    <circle class="pin" cx="300" cy="167" r="10"/><text x="296" y="171" class="pintxt">2</text>
    <circle class="pin" cx="1030" cy="20" r="10"/><text x="1026" y="24" class="pintxt">2</text>
    <circle class="pin" cx="150" cy="197" r="10"/><text x="146" y="201" class="pintxt">3</text>
    <circle class="pin" cx="150" cy="340" r="10"/><text x="146" y="344" class="pintxt">4</text>
    <circle class="pin" cx="720" cy="669" r="10"/><text x="716" y="673" class="pintxt">5</text>
    <circle class="pin" cx="250" cy="270" r="10"/><text x="246" y="274" class="pintxt">6</text>
    <circle class="pin" cx="1188" cy="22" r="10"/><text x="1184" y="26" class="pintxt">7</text>
  </g>

  <!-- legend -->
  <rect x="836" y="128" width="420" height="330" rx="10" fill="#161a21" stroke="#ef6b6b"/>
  <text x="852" y="150" font-weight="700" fill="#ef6b6b">Pain points</text>
  <g font-size="11">
    <text x="852" y="176" class="fg">① Two identical model pickers (sidebar = new-chat,</text><text x="866" y="192" class="muted">header = live chat) — same look, different scope.</text>
    <text x="852" y="214" class="fg">② auto-approve + API overflow appear twice</text><text x="866" y="230" class="muted">(new-chat row and header) — which one applies?</text>
    <text x="852" y="252" class="fg">③ New-chat controls permanently occupy prime</text><text x="866" y="268" class="muted">space, pushing the Chats list (the nav) down.</text>
    <text x="852" y="290" class="fg">④ Providers &amp; limits can eat up to 42vh, competing</text><text x="866" y="306" class="muted">with Chats for vertical room.</text>
    <text x="852" y="328" class="fg">⑤ Tasks — the heart of an orchestration tool —</text><text x="866" y="344" class="muted">are a thin strip, one line each, easy to miss.</text>
    <text x="852" y="366" class="fg">⑥ No single global budget headline where you</text><text x="866" y="382" class="muted">spend; limits are buried as per-provider meters.</text>
    <text x="852" y="404" class="fg">⑦ Header crowded: title+cwd+3 selects+2 checks+</text><text x="866" y="420" class="muted">status+stop on one row → truncates when narrow.</text>
    <text x="852" y="446" class="muted">Colors/tokens taken from ui/styles.css.</text>
  </g>
</svg>
